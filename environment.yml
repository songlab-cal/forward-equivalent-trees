name: fe-sim  # Replace with the desired name for your environment
channels:
  - defaults
  - conda-forge

dependencies:
  # bdms-sim 0.3 depends on ete3, which doesn't support Python 3.13+
  - python>=3.11,<3.13
  - numpy
  - pandas
  - seaborn
  - jupyter
  - ipykernel  # Optional, but useful for managing kernels in Jupyter
  - pip
  - pip:
    # the notebooks use the bdms-sim 0.3 API
    - bdms-sim==0.3.1
  
